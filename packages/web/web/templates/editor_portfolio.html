<details class="editor-section" id="editor-portfolio">
  <summary class="editor-section-summary"><h2>{{ sections.PORTFOLIO_TITLE }}</h2></summary>
  <form
    hx-patch="{{ routes.PLAN_PORTFOLIO }}?plan={{ plan_id }}"
    hx-trigger="input changed delay:750ms"
    hx-swap="none"
  >
    <p class="helper-text">
      Investment accounts only — exclude home equity and real estate.
    </p>
    <label>
      Total savings balance
      <input
        type="text"
        inputmode="decimal"
        class="currency-input"
        name="{{ forms.CURRENT_SAVINGS_BALANCE }}"
        value="{{ plan.portfolio.current_savings_balance|usd }}"
      >
    </label>
  </form>
</details>
