{% import "_range_slider.html" as range_slider %}
<section class="editor-section">
  <h2>{{ sections.RISK_TITLE }}</h2>
  <form
    hx-patch="{{ routes.PLAN_RISK }}?plan={{ plan_id }}"
    hx-trigger="input changed delay:750ms"
    hx-swap="none"
  >
    <label>
      Base Risk tolerance
      {{ range_slider.range_with_value(
        forms.RISK_TOLERANCE_AT_20,
        0,
        forms.RISK_TOLERANCE_NUM_VALUES - 1,
        1,
        plan.risk.risk_tolerance_at_20
      ) }}
    </label>
    <p class="field-help">
      <span>Conservative</span>
      <span>Moderate</span>
      <span>Aggressive</span>
    </p>

    <label>
      Additional annual spending tilt
      {{ range_slider.range_with_value(
        forms.ADDITIONAL_ANNUAL_SPENDING_TILT,
        forms.PERCENT_SLIDER_MIN,
        forms.PERCENT_SLIDER_MAX,
        forms.PERCENT_SLIDER_STEP,
        plan.risk.additional_annual_spending_tilt|percent_points,
        display=plan.risk.additional_annual_spending_tilt|percent,
        suffix='%'
      ) }}
    </label>

    <details>
      <summary>Advanced risk settings</summary>
      <label>
        Risk tolerance change by max age
        <input
          type="text"
          inputmode="decimal"
          name="{{ forms.DELTA_AT_MAX_AGE }}"
          value="{{ plan.risk.delta_at_max_age }}"
        >
      </label>
      <label>
        Legacy risk tolerance delta from age 20
        <input
          type="text"
          inputmode="decimal"
          name="{{ forms.LEGACY_DELTA_FROM_AT_20 }}"
          value="{{ plan.risk.legacy_delta_from_at_20 }}"
        >
      </label>
      <label>
        Time preference
        {{ range_slider.range_with_value(
          forms.TIME_PREFERENCE,
          forms.PERCENT_SLIDER_MIN,
          forms.PERCENT_SLIDER_MAX,
          forms.PERCENT_SLIDER_STEP,
          plan.risk.time_preference|percent_points,
          display=plan.risk.time_preference|percent,
          suffix='%'
        ) }}
      </label>
    </details>
  </form>
</section>
