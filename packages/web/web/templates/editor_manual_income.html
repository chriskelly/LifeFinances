{% import "_stream_row.html" as streams %}
{% set people = forms.people_choices(plan) %}

<section class="editor-section">
  <h2>{{ sections.MANUAL_INCOME_TITLE }}</h2>
  <form
    hx-patch="{{ routes.PLAN_MANUAL_INCOME }}?plan={{ plan_id }}"
    hx-trigger="input changed delay:750ms, change delay:750ms"
    hx-swap="none"
  >
    <div class="rows" data-prefix="{{ forms.STREAMS_PREFIX }}">
      {% for stream in plan.manual_income_streams %}{{ streams.stream_row(forms.STREAMS_PREFIX, loop.index0, stream, people) }}{% endfor %}
      <template class="row-template">{{ streams.stream_row(forms.STREAMS_PREFIX, 0, none, people) }}</template>
      <button type="button" data-add-row>Add income stream</button>
    </div>
  </form>
</section>
