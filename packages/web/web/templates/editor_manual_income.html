{% import "_stream_row.html" as streams %}
{% set people = forms.people_choices(plan) %}

<details class="editor-section" id="editor-manual-income">
  <summary class="editor-section-summary"><h2>{{ sections.MANUAL_INCOME_TITLE }}</h2></summary>
  <form
    hx-patch="{{ routes.PLAN_MANUAL_INCOME }}?plan={{ plan_id }}"
    hx-trigger="input changed delay:750ms, change delay:750ms"
    hx-swap="none"
  >
    {{ streams.stream_rows(forms.STREAMS_PREFIX, plan.manual_income_streams, people, empty_label="Untitled income stream", add_label="Add income stream") }}
  </form>
</details>
